name: Governance Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: [Quality Checks]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  trust-governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce trust notes + reviewer coverage
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request payload is missing.');
              return;
            }

            const openTrustBugs = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:P0-trust`
            });

            if ((openTrustBugs.data?.total_count || 0) > 0) {
              core.setFailed('Merge blocked: open P0-trust issue(s) exist. Resolve or relabel them before merging.');
              return;
            }

            const trustPathPatterns = [
              /^api\//,
              /^services\/authService\.ts$/,
              /^services\/storage\.ts$/,
              /^supabase\/migrations\//,
              /^\.github\/workflows\//,
              /^docs\/vision-lock-v1\.md$/,
              /^HIERARCHY_STRUCTURE\.md$/
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changedFiles = files.map((file) => file.filename);
            const touchesTrustBoundary = changedFiles.some((path) =>
              trustPathPatterns.some((pattern) => pattern.test(path))
            );

            if (!touchesTrustBoundary) {
              core.info('No trust-boundary files changed; governance gate skipped.');
              return;
            }

            const body = pr.body || '';
            const trustSectionMatch = body.match(/##\s*Trust Change Notes([\s\S]*?)(?:\n##\s|$)/i);
            const trustSection = trustSectionMatch ? trustSectionMatch[1].trim() : '';
            const hasMeaningfulTrustNotes = Boolean(
              trustSection &&
              trustSection.length >= 20 &&
              !/^(none|n\/a|na|no changes?)\.?$/i.test(trustSection)
            );

            if (!hasMeaningfulTrustNotes) {
              core.setFailed(
                'Trust-boundary changes detected, but `## Trust Change Notes` is missing or not detailed enough (min 20 chars, no "None/N/A").'
              );
              return;
            }

            const requestedReviewerCount =
              (pr.requested_reviewers || []).length +
              (pr.requested_teams || []).length;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const approvalCount = new Set(
              reviews
                .filter((review) => review.state === 'APPROVED' && review.user?.login)
                .map((review) => review.user.login)
            ).size;

            if (requestedReviewerCount === 0 && approvalCount === 0) {
              core.setFailed(
                'Trust-boundary changes require reviewer assignment or an approval before merge. Add a reviewer or request CODEOWNER review.'
              );
              return;
            }

            core.info('Governance checks passed for trust-boundary PR changes.');

  direct-push-governance:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce trust notes on direct production pushes
        uses: actions/github-script@v7
        with:
          script: |
            const before = context.payload.before;
            const after = context.payload.after;
            const branchRef = context.ref || '';

            const openTrustBugs = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:P0-trust`
            });

            if ((openTrustBugs.data?.total_count || 0) > 0) {
              core.setFailed('Direct push blocked: open P0-trust issue(s) exist. Resolve or relabel them first.');
              return;
            }

            if (!before || !after) {
              core.info('Push payload missing commit range; skipping direct-push governance check.');
              return;
            }

            if (before === '0000000000000000000000000000000000000000') {
              core.info('Initial branch push detected; skipping direct-push governance check.');
              return;
            }

            const associatedPrs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: after
            });

            if ((associatedPrs.data || []).length > 0) {
              core.info('Push commit is associated with a pull request; PR governance already applies.');
              return;
            }

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${before}...${after}`
            });

            const files = compare.data.files || [];
            const changedFiles = files.map((file) => file.filename);

            const trustPathPatterns = [
              /^api\//,
              /^services\/authService\.ts$/,
              /^services\/storage\.ts$/,
              /^supabase\/migrations\//,
              /^\.github\/workflows\//,
              /^docs\/vision-lock-v1\.md$/,
              /^HIERARCHY_STRUCTURE\.md$/
            ];

            const touchesTrustBoundary = changedFiles.some((path) =>
              trustPathPatterns.some((pattern) => pattern.test(path))
            );

            if (!touchesTrustBoundary) {
              core.info('No trust-boundary files changed in direct push; governance gate skipped.');
              return;
            }

            const headCommit = context.payload.head_commit || {};
            const headMessage = String(headCommit.message || '');
            const trustNoteMatch = headMessage.match(/(?:^|\n)Trust-Note:\s*(.+)$/im);
            const trustNote = trustNoteMatch ? trustNoteMatch[1].trim() : '';

            if (!trustNote || trustNote.length < 20) {
              core.setFailed(
                `Direct push to ${branchRef} touched trust-boundary files but is missing a detailed commit trailer: ` +
                '`Trust-Note: <what changed + risk/rollback summary>` (min 20 chars).'
              );
              return;
            }

            core.info('Direct push governance checks passed.');

  rollback-tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create rollback tag
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${TARGET_SHA:0:7}"
          TAG_NAME="rollback-${TARGET_BRANCH}-${RUN_ID}-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Rollback tag already exists: ${TAG_NAME}"
            exit 0
          fi

          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "Rollback point for ${TARGET_BRANCH} (${SHORT_SHA})"
          git push origin "refs/tags/${TAG_NAME}"